<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Hors connexion · KODAV</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 16px;
        font-family: system-ui, sans-serif;
        background: #f4f6f9;
        color: #0b1b33;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0b1b33;
          color: #eef2f7;
        }
      }
      main {
        max-width: 28rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p {
        line-height: 1.5;
        margin: 0 0 1rem;
      }
      button {
        font: inherit;
        padding: 0.7rem 1.1rem;
        border-radius: 6px;
        border: 0;
        background: #1d3a64;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Vous êtes hors connexion</h1>
      <p>
        Cette page n’a pas encore été enregistrée sur votre appareil. Vérifiez votre connexion
        internet puis réessayez.
      </p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
